<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Novel Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:#f5f2ee;
  --surface:#fff;
  --surface-hover:#f9f7f5;
  --border:#e8e3dd;
  --border-light:#f0ece7;
  --text-primary:#1a1714;
  --text-secondary:#6b6560;
  --text-muted:#a09890;
  --accent:#3b6ea5;
  --accent-light:#eef3f9;
  --accent-hover:#2d5a8e;
  --danger:#c0392b;
  --danger-light:#fdf2f1;
  --sidebar-bg:#eeeae4;
  --sidebar-w:260px;
  --topbar-h:52px;
  --gold:#e6a817;
  --green:#2e7d5e;
  --purple:#7c5cbf;
  --rose:#b5485a;
}

html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text-primary)}

/* ── TOPBAR ── */
.topbar {
  height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100;
  position:fixed;top:0;left:0;right:0;
}
.topbar-logo {
  display:flex;align-items:center;gap:9px;font-family:'Lora',serif;font-size:17px;font-weight:700;
  letter-spacing:-.3px;cursor:pointer;border:none;background:none;padding:0;
  background-image:linear-gradient(95deg,#5e7bbd 0%,#a78bfa 60%,#5e7bbd 100%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:logoShift 8s linear infinite;text-decoration:none;
}
@keyframes logoShift{0%{background-position:0%}100%{background-position:200%}}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#a78bfa,#3b6ea5);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(124,147,208,.4)}
.logo-icon svg{display:block}
.back-btn {
  display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);
  background:none;border:1px solid var(--border);border-radius:7px;padding:0 10px;height:30px;
  cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;
}
.back-btn:hover{background:var(--surface-hover);color:var(--text-primary)}
.topbar-spacer{flex:1}
.topbar-title{font-size:13px;font-weight:500;color:var(--text-secondary)}

/* ── LAYOUT ── */
.app {display:flex;height:100vh;padding-top:var(--topbar-h)}

/* ── SIDEBAR ── */
.sidebar {
  width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
}

/* ── PROJECT PANEL ── */
.proj-panel {
  position:fixed;top:var(--topbar-h);left:0;
  width:240px;max-height:calc(100vh - var(--topbar-h));
  background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  overflow-y:auto;z-index:200;
  transform:translateX(-100%);transition:transform .2s ease;
  box-shadow:4px 0 16px rgba(0,0,0,.08);
  display:flex;flex-direction:column;
}
.proj-panel.open { transform:translateX(0); }
.proj-panel-header {
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 12px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.proj-panel-label { font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted) }
.proj-toggle-btn {
  display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;
  border:none;background:none;cursor:pointer;font-size:12px;font-weight:500;
  color:var(--text-secondary);font-family:'DM Sans',sans-serif;transition:background .12s;
}
.proj-toggle-btn:hover { background:var(--surface-hover); }
.sidebar-header {
  padding:14px 14px 10px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.sidebar-header-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.sidebar-new-btn{width:24px;height:24px;border-radius:6px;border:none;background:none;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;transition:background .15s,color .15s}
.sidebar-new-btn:hover{background:var(--border);color:var(--accent)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:14px;padding:28px;width:420px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.18),0 4px 16px rgba(0,0,0,.1);animation:slideUp .18s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-family:'Lora',serif;font-size:19px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.modal-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.modal-field label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted)}
.modal-field input,.modal-field textarea{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text-primary);background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;outline:none;transition:border-color .15s;resize:none}
.modal-field input:focus,.modal-field textarea:focus{border-color:var(--accent)}
.modal-color-row{display:flex;gap:8px;flex-wrap:wrap}
.modal-color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s}
.modal-color-swatch:hover{transform:scale(1.15)}
.modal-color-swatch.selected{border-color:var(--text-primary);transform:scale(1.1)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal-emoji-row{display:flex;gap:6px;flex-wrap:wrap}
.modal-emoji-btn{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,background .12s,color .12s;color:var(--text-muted);flex-shrink:0}
.modal-emoji-btn:hover{background:var(--surface-hover);color:var(--text-secondary)}
.modal-emoji-btn.selected{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.modal-emoji-btn svg{display:block;pointer-events:none}
.sidebar-list{flex:1;overflow-y:auto;padding:8px 6px}
.sidebar-list::-webkit-scrollbar{width:4px}
.sidebar-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.project-item {
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  cursor:pointer;transition:background .12s;margin-bottom:2px;
}
.project-item:hover{background:var(--sidebar-active,#ddd8d1)}
.project-item.active{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.project-avatar {
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  color:#fff;font-family:'Lora',serif;
}
.project-info{flex:1;min-width:0}
.project-name{font-size:13px;font-weight:500;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-item.active .project-name{color:var(--text-primary)}
.project-meta{font-size:11px;color:var(--text-muted);margin-top:1px}
.no-projects{padding:30px 16px;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.6}
.no-projects strong{display:block;font-size:15px;margin-bottom:6px;color:var(--text-secondary)}

/* ── MAIN AREA ── */
.main {flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── WELCOME ── */
.welcome {
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--text-muted);padding:40px;
}
.welcome-icon{font-size:48px;opacity:.4}
.welcome h2{font-family:'Lora',serif;font-size:22px;color:var(--text-secondary);font-weight:600}
.welcome p{font-size:14px;text-align:center;max-width:320px;line-height:1.6}

/* ── WIKI AREA ── */
.wiki {display:flex;flex:1;overflow:hidden}

/* ── WIKI SIDEBAR (sections) ── */
.wiki-nav {
  width:190px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:12px 6px;
}
.wiki-nav-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);padding:6px 10px 4px}
.wiki-nav-item {
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--text-secondary);transition:background .12s;margin-bottom:1px;
}
.wiki-nav-item:hover{background:var(--surface-hover)}
.wiki-nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.wiki-nav-item .nav-icon{font-size:15px;flex-shrink:0}
.wiki-nav-divider{height:1px;background:var(--border);margin:8px 6px}

/* ── WIKI CONTENT ── */
.wiki-content {
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.canvas-wrap {
  flex:1;overflow:hidden;position:relative;background:var(--bg);
  background-image:radial-gradient(circle,#d5cfc8 1px,transparent 1px);
  background-size:24px 24px;cursor:grab;user-select:none;
}
.canvas-wrap.panning{cursor:grabbing}
.canvas { width:4000px;height:3000px;position:relative;transform-origin:0 0; }
/* ── CARD PICKER PANEL ── */
.card-picker-panel{
  position:absolute;top:100%;right:0;z-index:3000;width:320px;max-height:420px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.16);display:flex;flex-direction:column;
  overflow:hidden;animation:fadeIn .15s ease;
}
.card-picker-header{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.card-picker-search{
  flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;
  padding:5px 10px;font-family:'DM Sans',sans-serif;font-size:12px;outline:none;
  color:var(--text-primary);
}
.card-picker-search:focus{border-color:var(--accent)}
.card-picker-list{flex:1;overflow-y:auto;padding:6px}
.card-picker-list::-webkit-scrollbar{width:4px}
.card-picker-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.card-picker-item{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;
  cursor:pointer;transition:background .12s;
}
.card-picker-item:hover{background:var(--surface-hover)}
.card-picker-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.card-picker-name{font-size:12px;font-weight:500;color:var(--text-primary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-picker-type{font-size:10px;color:var(--text-muted)}
.card-picker-place{
  padding:3px 8px;border-radius:6px;font-size:11px;
  background:var(--accent-light);color:var(--accent);border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:background .12s;
}
.card-picker-place:hover{background:var(--accent);color:#fff}
.card-picker-empty{padding:24px;text-align:center;color:var(--text-muted);font-size:13px}
.wiki-actions{display:flex;gap:6px;position:relative}


.toolbar-wrap{
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;flex-shrink:0;position:relative;
}
.toolbar-scroll-btn{
  flex-shrink:0;width:28px;height:100%;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:none;cursor:pointer;color:var(--text-muted);
  font-size:14px;transition:color .15s;z-index:2;
}
.toolbar-scroll-btn:hover{color:var(--text-primary)}
.toolbar-scroll-btn.hidden{opacity:0;pointer-events:none}
.toolbar-scroll-btn.left{border-right:1px solid var(--border)}
.toolbar-scroll-btn.right{border-left:1px solid var(--border)}
.add-toolbar {
  flex:1;padding:8px 4px;
  display:flex;align-items:center;gap:6px;overflow-x:auto;scroll-behavior:smooth;
  scrollbar-width:none;
}
.add-toolbar::-webkit-scrollbar{display:none}
.toolbar-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;margin-right:2px;padding:0 8px}
.toolbar-item {
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:7px;
  background:var(--surface-hover);border:1px solid var(--border);cursor:grab;
  font-size:11px;color:var(--text-secondary);white-space:nowrap;transition:all .15s;
  user-select:none;flex-shrink:0;
}
.toolbar-item:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.toolbar-item:active{cursor:grabbing;transform:scale(.96)}
.toolbar-sep{width:1px;height:24px;background:var(--border);flex-shrink:0;margin:0 2px}

/* ── FRAMES — folder tiles ── */
.frame-tile {
  position:absolute;border-radius:16px;cursor:pointer;user-select:none;
  width:220px;transition:transform .18s,box-shadow .18s;
  box-shadow:0 6px 24px rgba(0,0,0,.13),0 1px 4px rgba(0,0,0,.07);
}
.frame-tile:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08)}
.frame-tile.drag-over{transform:scale(1.04);box-shadow:0 16px 40px rgba(0,0,0,.22)}
.frame-tile-inner{border-radius:16px;overflow:hidden}

/* top preview area */
.frame-tile-preview{
  height:148px;position:relative;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;
}
.frame-tile-cards-stack{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
/* individual mini card previews */
.frame-mini-card{
  position:absolute;border-radius:9px;overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
  background:var(--surface);font-size:0;
  transition:transform .2s;
}
.frame-mini-header{height:18px;display:flex;align-items:center;padding:0 7px;gap:4px}
.frame-mini-title{font-family:'DM Sans',sans-serif;font-size:8px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1}
.frame-mini-body{padding:5px 7px;font-family:'DM Sans',sans-serif;font-size:7.5px;color:var(--text-muted);line-height:1.4;overflow:hidden}
.frame-mini-line{height:2px;border-radius:1px;margin:2px 0;background:var(--border)}
.frame-empty-preview{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:rgba(255,255,255,.35);height:100%;
  font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.02em;
}

/* footer */
.frame-tile-bot{
  padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:6px;
  border-top:1px solid rgba(255,255,255,.12);
}
.frame-tile-label{
  font-family:'Lora',serif;font-size:12px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  background:none;border:none;outline:none;cursor:text;
  text-shadow:0 1px 3px rgba(0,0,0,.3);min-width:0;
}
.frame-tile-label::placeholder{color:rgba(255,255,255,.4);font-style:italic}
.frame-tile-count{
  font-size:10px;font-weight:600;color:rgba(255,255,255,.7);
  background:rgba(0,0,0,.2);border-radius:10px;padding:2px 7px;flex-shrink:0;
}
.frame-drag-handle{cursor:move;color:rgba(255,255,255,.4);font-size:11px;flex-shrink:0}
.frame-delete{background:none;border:none;color:rgba(255,255,255,.3);font-size:15px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;transition:color .12s}
.frame-delete:hover{color:#fff}

/* frame color themes — richer gradients */
.frame-purple .frame-tile-preview{background:linear-gradient(155deg,#9b72e8 0%,#5e3fa0 60%,#3d2870 100%)}
.frame-blue   .frame-tile-preview{background:linear-gradient(155deg,#5b93d4 0%,#2d5a8e 60%,#1a3a62 100%)}
.frame-green  .frame-tile-preview{background:linear-gradient(155deg,#4aab84 0%,#1e6647 60%,#0f3d2a 100%)}
.frame-rose   .frame-tile-preview{background:linear-gradient(155deg,#d4697a 0%,#8a3245 60%,#591e2e 100%)}
.frame-gold   .frame-tile-preview{background:linear-gradient(155deg,#f0bc3a 0%,#c8880a 60%,#7d5200 100%)}
.frame-slate  .frame-tile-preview{background:linear-gradient(155deg,#7a8fc0 0%,#3d4f7a 60%,#232e4d 100%)}
.frame-rust   .frame-tile-preview{background:linear-gradient(155deg,#d4824a 0%,#8a3e18 60%,#5a2208 100%)}
.frame-teal   .frame-tile-preview{background:linear-gradient(155deg,#3ab5cc 0%,#1a6070 60%,#0d3a46 100%)}
.frame-charcoal .frame-tile-preview{background:linear-gradient(155deg,#6a6a7c 0%,#2d2d3a 60%,#18181e 100%)}
.frame-crimson  .frame-tile-preview{background:linear-gradient(155deg,#d44a3a 0%,#8e1a10 60%,#5a0d08 100%)}
.frame-purple .frame-tile-bot{background:linear-gradient(135deg,#6a3fb5,#4a2d85)}
.frame-blue   .frame-tile-bot{background:linear-gradient(135deg,#2d5a8e,#1a3a62)}
.frame-green  .frame-tile-bot{background:linear-gradient(135deg,#1e6647,#0f3d2a)}
.frame-rose   .frame-tile-bot{background:linear-gradient(135deg,#8a3245,#591e2e)}
.frame-gold   .frame-tile-bot{background:linear-gradient(135deg,#c8880a,#7d5200)}
.frame-slate  .frame-tile-bot{background:linear-gradient(135deg,#3d4f7a,#232e4d)}
.frame-rust   .frame-tile-bot{background:linear-gradient(135deg,#8a3e18,#5a2208)}
.frame-teal   .frame-tile-bot{background:linear-gradient(135deg,#1a6070,#0d3a46)}
.frame-charcoal .frame-tile-bot{background:linear-gradient(135deg,#2d2d3a,#18181e)}
.frame-crimson  .frame-tile-bot{background:linear-gradient(135deg,#8e1a10,#5a0d08)}

/* ── FRAME OVERLAY ── */
.frame-overlay{
  position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;
  background:rgba(15,12,10,.75);backdrop-filter:blur(6px);animation:fadeIn .18s ease;
}
.frame-overlay-header{
  display:flex;align-items:center;gap:12px;padding:14px 20px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.frame-overlay-title{font-family:'Lora',serif;font-size:17px;font-weight:600;flex:1;
  background:none;border:none;outline:none;color:var(--text-primary)}
.frame-overlay-sub{font-size:12px;color:var(--text-muted)}
.frame-overlay-close{display:flex;align-items:center;gap:6px;padding:0 12px;height:32px;
  border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-secondary);transition:all .15s}
.frame-overlay-close:hover{background:var(--surface-hover);color:var(--text-primary)}
.frame-overlay-canvas-wrap{
  flex:1;overflow:hidden;position:relative;
  background:var(--bg);
  background-image:radial-gradient(circle,#d5cfc8 1px,transparent 1px);
  background-size:24px 24px;cursor:grab;
}
.frame-overlay-canvas-wrap.panning{cursor:grabbing}
.frame-overlay-canvas{width:3000px;height:2000px;position:relative;transform-origin:0 0}
.frame-overlay-toolbar{
  background:var(--surface);border-top:1px solid var(--border);
  padding:8px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  font-size:12px;color:var(--text-muted);
}
.eject-btn{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;
  background:var(--bg);border:1px solid var(--border);font-size:11px;color:var(--text-secondary);
  cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;
}
.eject-btn:hover{background:var(--danger-light);border-color:var(--danger);color:var(--danger)}

/* ── REF CARDS (pinned overview references) ── */
.ref-card{
  position:absolute;width:160px;height:200px;border-radius:14px;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,0,0,.15),0 1px 4px rgba(0,0,0,.08);
  overflow:hidden;user-select:none;transition:transform .18s,box-shadow .18s;
}
.ref-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.2)}
.ref-card.dragging{box-shadow:0 18px 48px rgba(0,0,0,.25);z-index:1000;transform:scale(1.03)}

/* image version — photo fills entire card */
.ref-card-img-bg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
}
.ref-card-img-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.2) 50%, rgba(0,0,0,.05) 100%);
}
/* no-image version — solid color */
.ref-card-color-bg{
  position:absolute;inset:0;
}

/* shared bottom content */
.ref-card-content{
  position:absolute;bottom:0;left:0;right:0;padding:10px 11px;
}
.ref-card-label-chip{
  display:inline-block;font-size:8px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:4px;
}
.ref-card-name{
  font-family:'Lora',serif;font-size:13px;font-weight:600;color:#fff;
  line-height:1.3;display:block;text-shadow:0 1px 4px rgba(0,0,0,.4);
}
.ref-card-snippet-text{
  font-size:10px;color:rgba(255,255,255,.65);margin-top:3px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  font-family:'Crimson Pro',serif;font-size:11px;line-height:1.4;
}

/* top-right delete + section badge */
.ref-card-topbar{
  position:absolute;top:8px;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;padding:0 8px;
}
.ref-card-section-badge{
  font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  background:rgba(0,0,0,.3);color:rgba(255,255,255,.8);padding:2px 7px;
  border-radius:20px;backdrop-filter:blur(4px);
}
.ref-card-del{
  background:rgba(0,0,0,.3);border:none;color:rgba(255,255,255,.7);
  width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);transition:background .12s,color .12s;line-height:1;
}
.ref-card-del:hover{background:rgba(180,30,30,.7);color:#fff}
.drop-confirm{pointer-events:auto}
.drop-confirm-inner{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;
  padding:12px 16px;box-shadow:0 12px 40px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.1);
  min-width:280px;max-width:360px;
}
.drop-confirm-icon{
  width:36px;height:36px;border-radius:10px;background:var(--accent-light);
  display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;
}
.drop-confirm-text{flex:1;min-width:0}
.drop-confirm-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px}
.drop-confirm-sub{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop-confirm-sub b{color:var(--text-secondary)}
.drop-confirm-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.drop-confirm-yes{
  padding:5px 14px;border-radius:7px;border:none;
  background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;transition:background .12s;white-space:nowrap;
}
.drop-confirm-yes:hover{background:var(--accent-hover)}
.drop-confirm-no{
  padding:4px 14px;border-radius:7px;border:1px solid var(--border);
  background:none;color:var(--text-muted);font-family:'DM Sans',sans-serif;
  font-size:11px;cursor:pointer;transition:all .12s;white-space:nowrap;
}
.drop-confirm-no:hover{background:var(--surface-hover);color:var(--text-primary)}
.color-dot{
  width:12px;height:12px;border-radius:50%;flex-shrink:0;cursor:pointer;
  border:2px solid rgba(255,255,255,.5);transition:transform .12s;margin-right:1px;
}
.color-dot:hover{transform:scale(1.25)}
.color-popover{
  position:absolute;top:calc(100% + 6px);left:0;z-index:2000;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.16);
  display:flex;flex-wrap:wrap;gap:5px;width:128px;
  animation:fadeIn .1s ease;
}
.color-swatch{
  width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform .12s,border-color .12s;flex-shrink:0;
}
.color-swatch:hover{transform:scale(1.2)}
.color-swatch.active{border-color:var(--text-primary)}
/* frame tile color btn */
.frame-color-dot{
  width:14px;height:14px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:2px solid rgba(255,255,255,.4);transition:transform .12s;
}
.frame-color-dot:hover{transform:scale(1.2)}
.card {
  position:absolute;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1),0 1px 4px rgba(0,0,0,.06);
  cursor:move;user-select:none;transition:box-shadow .15s;min-width:200px;
}
.card:hover{box-shadow:0 8px 30px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.08)}
.card.dragging{box-shadow:0 16px 40px rgba(0,0,0,.2);z-index:1000;opacity:.95}
.card-header{padding:10px 12px 8px;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:8px}
.card-drag-handle{cursor:move;color:rgba(255,255,255,.6);font-size:13px}
.card-title-input{flex:1;background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#fff}
.card-title-input::placeholder{color:rgba(255,255,255,.5)}
.card-close{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:16px;line-height:1;padding:0 2px;transition:color .12s}
.card-close:hover{color:#fff}
.card-body{background:var(--surface);border-radius:0 0 12px 12px;overflow:hidden}

/* CHARACTER — collapsed card */
.char-card, .char-card-full{
  position:absolute;width:160px;height:200px;border-radius:14px;overflow:hidden;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,0,0,.15),0 1px 4px rgba(0,0,0,.08);
  transition:transform .18s,box-shadow .18s;
}
.char-card:hover,.char-card-full:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.2)}
.char-collapsed-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.char-collapsed-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.04) 100%);pointer-events:none}
.char-collapsed-color{position:absolute;inset:0;pointer-events:none}
.char-collapsed-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:7px 8px}
.char-collapsed-controls{display:flex;gap:3px}
.char-collapsed-btn{width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.3);color:rgba(255,255,255,.8);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:background .12s;line-height:1;padding:0;flex-shrink:0}
.char-collapsed-btn:hover{background:rgba(0,0,0,.6);color:#fff}
.char-collapsed-bottom{position:absolute;bottom:0;left:0;right:0;padding:9px 10px}
.char-collapsed-role{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:3px}
.char-collapsed-name{font-family:'Lora',serif;font-size:13px;font-weight:600;color:#fff;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.char-collapsed-traits{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.char-collapsed-trait-chip{font-size:8px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.18);color:rgba(255,255,255,.85)}

/* CHARACTER — old layout helpers kept for modal */
.char-fields{padding:8px 0;display:flex;flex-direction:column;gap:6px}
.char-field{display:flex;flex-direction:column;gap:2px}
.char-field label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.char-field input,.char-field textarea{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-primary);background:none;border:none;border-bottom:1px solid var(--border-light);outline:none;padding:1px 0 3px;width:100%;resize:none;transition:border-color .15s}
.char-field input:focus,.char-field textarea:focus{border-bottom-color:var(--accent)}
.char-tags{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0 2px}
.char-tag-input{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px dashed var(--border);outline:none;font-family:'DM Sans',sans-serif;min-width:55px;text-align:center;color:var(--text-secondary)}

/* CHARACTER FULL — modal fields */
.char-full-img{width:100%;height:160px;background:linear-gradient(135deg,#ede9f6,#ddd6f3);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;color:#b8aade}
.char-full-img:hover .char-img-hint{opacity:1}
.char-full-img img,.loc-full-img img,.loc-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.char-img-hint{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);color:#fff;font-size:10px;text-align:center;padding:5px;opacity:0;transition:opacity .2s;letter-spacing:.04em}
.char-full-body{display:flex;flex-direction:column;gap:0}
.char-full-role{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);background:none;border:none;outline:none;width:100%;margin-bottom:8px}
.char-full-role::placeholder{color:var(--border)}
.char-full-divider{height:1px;background:linear-gradient(90deg,var(--border),transparent);margin:6px 0}
.char-full-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-bottom:6px}
.char-full-field{display:flex;flex-direction:column;gap:2px}
.char-full-field label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.char-full-field input,.char-full-field textarea{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-primary);background:none;border:none;border-bottom:1px solid var(--border-light);outline:none;padding:1px 0 3px;width:100%;resize:none;transition:border-color .15s;line-height:1.5}
.char-full-field input:focus,.char-full-field textarea:focus{border-bottom-color:var(--accent)}
.char-full-traits{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0 2px}
.char-full-trait{font-size:10px;padding:2px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--border);color:var(--text-secondary);outline:none;font-family:'DM Sans',sans-serif;min-width:55px;text-align:center}
.char-full-trait:focus{border-color:var(--accent);background:var(--accent-light)}
.char-full-trait::placeholder{color:var(--border)}

/* CHARACTER EXPAND MODAL */
.char-modal-overlay{position:fixed;inset:0;z-index:8000;background:rgba(10,8,6,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fadeIn .18s ease}
.char-modal{background:var(--surface);border-radius:18px;width:520px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.28);animation:slideUp .2s ease}
.char-modal-hero{height:180px;position:relative;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,#7c5cbf,#5e4a9e);cursor:pointer}
.char-modal-hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.char-modal-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 60%)}
.char-modal-hero-bottom{position:absolute;bottom:12px;left:16px;right:16px;display:flex;align-items:flex-end;justify-content:space-between}
.char-modal-hero-name{font-family:'Lora',serif;font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.char-modal-hero-hint{font-size:10px;color:rgba(255,255,255,.55)}
.char-modal-title-row{display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-shrink:0}
.char-modal-title-input{font-family:'Lora',serif;font-size:17px;font-weight:600;flex:1;background:none;border:none;border-bottom:2px solid var(--border);outline:none;color:var(--text-primary);padding-bottom:4px;transition:border-color .15s}
.char-modal-title-input:focus{border-bottom-color:var(--accent)}
.char-modal-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text-muted);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.char-modal-close:hover{background:var(--surface-hover);color:var(--text-primary)}
.char-modal-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.char-modal-body::-webkit-scrollbar{width:4px}
.char-modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* LOCATION */
.loc-card .card-header{background:linear-gradient(135deg,#2e7d5e,#1e5c44)}
.loc-card .card-body{padding:0}
.loc-img{width:100%;height:90px;background:linear-gradient(135deg,#e8f5f0,#d4ece3);border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;color:#7abfaa;gap:4px}
.loc-img:hover .char-img-hint{opacity:1}
.loc-img-label{font-size:10px;color:var(--text-muted)}
.loc-fields{padding:8px 11px;display:flex;flex-direction:column;gap:5px}

/* LOCATION FULL */
.loc-card-full .card-header{background:linear-gradient(135deg,#1e5c44,#124033)}
.loc-full-img{width:100%;height:180px;background:linear-gradient(135deg,#e0f0eb,#c8e6dd);border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;color:#7abfaa}
.loc-full-img:hover .char-img-hint{opacity:1}
.loc-full-body{padding:11px 13px;display:flex;flex-direction:column;gap:0}
.loc-full-role{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);background:none;border:none;outline:none;width:100%;margin-bottom:8px}
.loc-full-role::placeholder{color:var(--border)}
.loc-full-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-bottom:6px}
.loc-full-divider{height:1px;background:linear-gradient(90deg,var(--border),transparent);margin:5px 0}
.loc-full-field{display:flex;flex-direction:column;gap:2px}
.loc-full-field label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.loc-full-field input,.loc-full-field textarea{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-primary);background:none;border:none;border-bottom:1px solid var(--border-light);outline:none;padding:1px 0 3px;width:100%;resize:none;transition:border-color .15s;line-height:1.5}
.loc-full-field input:focus,.loc-full-field textarea:focus{border-bottom-color:var(--accent)}

/* NOTE */
.note-card{background:var(--surface)!important;border:1px solid var(--border)!important;min-width:220px}

/* TABLE */
.table-card .card-header{background:linear-gradient(135deg,#4a5568,#2d3748)}
.table-wrap{padding:10px 12px;overflow-x:auto}
.table-grid{border-collapse:collapse;font-size:12px;width:100%;min-width:200px}
.table-grid th{background:var(--bg);border:1px solid var(--border);padding:5px 8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);min-width:80px}
.table-grid td{border:1px solid var(--border);padding:0}
.table-cell{width:100%;background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-primary);padding:5px 8px;min-width:80px;resize:none;box-sizing:border-box}
.table-cell:focus{background:var(--accent-light)}
.table-setup{padding:12px;display:flex;flex-direction:column;gap:8px}
.table-setup-row{display:flex;align-items:center;gap:8px}
.table-setup-row label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);width:50px}
.table-size-input{width:58px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--bg);outline:none;text-align:center}
.table-size-input:focus{border-color:var(--accent)}
.table-add-btn{font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:2px 0;display:inline-flex;align-items:center;gap:3px}

/* TIMELINE */
.timeline-card .card-header{background:linear-gradient(135deg,#5a6ea0,#3d4f7a)}
.timeline-card .card-body{padding:10px 12px;min-width:240px}
.timeline-col{display:flex;flex-direction:column;gap:0}
.timeline-entry{display:flex;gap:10px;align-items:flex-start}
.tl-dot-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.timeline-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid white;box-shadow:0 0 0 2px var(--accent);margin-top:3px;flex-shrink:0}
.tl-line{width:2px;background:linear-gradient(to bottom,var(--accent),var(--border));flex:1;min-height:18px}
.timeline-entry-content{flex:1;padding-bottom:10px}
.tl-date{width:100%;background:none;border:none;border-bottom:1px dashed var(--border);outline:none;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);padding-bottom:2px;margin-bottom:3px}
.tl-text{width:100%;background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-secondary)}
.add-timeline-btn{font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px 0;font-family:'DM Sans',sans-serif}

/* TIMELINE FULL */
.timeline-full-card .card-header{background:linear-gradient(135deg,#3d4f7a,#28375c)}
.timeline-full-card .card-body{padding:12px;min-width:280px}
.tl-full-entry{display:flex;gap:12px;margin-bottom:4px}
.tl-full-dot-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.tl-full-dot{width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid white;box-shadow:0 0 0 2px var(--accent);margin-top:2px;flex-shrink:0}
.tl-full-line{width:2px;background:linear-gradient(to bottom,var(--accent),var(--border));flex:1;min-height:24px;margin-top:4px}
.tl-full-content{flex:1;background:var(--bg);border-radius:8px;padding:8px 10px;border:1px solid var(--border);margin-bottom:10px}
.tl-full-date{width:100%;background:none;border:none;border-bottom:1px dashed var(--border);outline:none;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding-bottom:2px;margin-bottom:4px;font-family:'DM Sans',sans-serif}
.tl-full-title{width:100%;background:none;border:none;outline:none;font-family:'Lora',serif;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:3px}
.tl-full-desc{width:100%;background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-secondary);resize:none;line-height:1.5}

/* RELATIONSHIP / RULE */
.rel-card .card-header{background:linear-gradient(135deg,#9c5c5c,#7a3d3d)}
.rel-card .card-body{padding:10px 12px;min-width:240px}
.rel-entry{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rel-avatar{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:'Lora',serif;color:var(--text-secondary)}
.rel-info{flex:1}
.rel-strength{display:flex;gap:2px}
.rel-heart{font-size:11px;color:var(--border);cursor:pointer}
.rel-heart.filled{color:#b5485a}
.rule-card .card-header{background:linear-gradient(135deg,#4a7a6e,#2e5c52)}
.rule-card .card-body{padding:10px 12px;min-width:220px}
.rule-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px}
.rule-num{width:19px;height:19px;border-radius:50%;background:var(--accent-light);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.rule-text{font-size:12px;color:var(--text-secondary);flex:1;background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;resize:none;border-bottom:1px dashed var(--border);padding-bottom:2px;width:100%}

/* Resize handle */
.resize-handle{position:absolute;bottom:4px;right:4px;width:12px;height:12px;cursor:se-resize;opacity:.3}
.resize-handle:hover{opacity:.7}
.resize-handle svg{display:block}

/* Canvas hint */
.canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--text-muted);pointer-events:none;opacity:.6}
.canvas-hint h3{font-family:'Lora',serif;font-size:18px;margin-bottom:6px;font-weight:500}
.canvas-hint p{font-size:13px}

/* Zoom controls */
.zoom-controls{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;gap:4px;z-index:50}
.zoom-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:background .12s;font-family:'DM Sans',sans-serif}
.zoom-btn:hover{background:var(--surface-hover)}
.zoom-level{font-size:10px;text-align:center;color:var(--text-muted);padding:1px 0}

<script type="module">
// ── IndexedDB helpers ─────────────────────────────────────────────────────────
const DB_NAME = 'folio_db', STORE_NAME = 'folio', DB_VERSION = 1;

function openIDB() {
  return new Promise((res, rej) => {
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        try { if (!req.result.objectStoreNames.contains(STORE_NAME)) req.result.createObjectStore(STORE_NAME); } catch(e) {}
      };
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error);
    } catch(e) { rej(e); }
  });
}
async function idbGet(key) {
  try {
    const db = await openIDB();
    return new Promise(res => {
      try {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => res(undefined);
        tx.oncomplete = () => { try { db.close(); } catch(e) {} };
      } catch(e) { res(undefined); }
    });
  } catch(e) { return undefined; }
}
async function idbSet(key, val) {
  try {
    const db = await openIDB();
    return new Promise(res => {
      try {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(val, key);
        tx.oncomplete = () => { try { db.close(); } catch(e) {} res(); };
        tx.onerror    = () => res();
      } catch(e) { res(); }
    });
  } catch(e) {}
}

const NN_KEY = 'novel_notes_v1';
let nnData = {};

async function loadNN()   { const s = await idbGet(NN_KEY); if (s) nnData = s; }
async function saveNN() {
  await idbSet(NN_KEY, nnData);
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'nn:save', data: nnData }, '*');
  }
}
function ensureProj(pid)  { if (!nnData[pid]) nnData[pid] = { sections:{}, cards:{} }; }
function getCards(pid, sid) {
  ensureProj(pid);
  if (!nnData[pid].cards[sid]) nnData[pid].cards[sid] = [];
  return nnData[pid].cards[sid];
}
function saveCards(pid, sid, cards) { ensureProj(pid); nnData[pid].cards[sid] = cards; saveNN(); }

function applyTransform() {
  const canvas = el('canvas');
  if (canvas) canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
}

function setZoom(z) {
  try {
    zoom = Math.min(2, Math.max(0.25, z));
    applyTransform();
    const lbl = el('zoomLabel');
    if (lbl) lbl.textContent = Math.round(zoom * 100) + '%';
  } catch(e) {}
}

// ── Canvas events ─────────────────────────────────────────────────────────────
var _panning = false, _panSX = 0, _panSY = 0;

function initCanvasEvents() {
  const wrap = el('canvasWrap');
  if (!wrap) return;

  // Pan: mousedown on background only
  wrap.onmousedown = function(e) {
    if (e.target !== wrap && !e.target.classList.contains('canvas')) return;
    _panning = true;
    _panSX = e.clientX - panX;
    _panSY = e.clientY - panY;
    wrap.style.cursor = 'grabbing';
  };

  // Zoom: wheel on canvas wrap
  wrap.onwheel = null;
  wrap.addEventListener('wheel', function(e) {
    e.preventDefault();
    setZoom(zoom - e.deltaY * 0.001);
  }, { passive: false });

  // Mouse move / up: once on document, safe to re-add since we check flags
  document.onmousemove = function(e) {
    if (dragCard) {
      const cvs = el('canvas');
      if (!cvs) { dragCard = null; return; }
      const rect = cvs.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / zoom - dragOffX;
      const ny = (e.clientY - rect.top)  / zoom - dragOffY;
      dragCard.style.left = Math.max(0, nx) + 'px';
      dragCard.style.top  = Math.max(0, ny) + 'px';
    }
    if (resizing) {
      resizing.el.style.width  = Math.max(200, resizeStartW + (e.clientX - resizeStartMX) / zoom) + 'px';
      resizing.el.style.height = Math.max(120, resizeStartH + (e.clientY - resizeStartMY) / zoom) + 'px';
    }
    if (_panning) {
      panX = e.clientX - _panSX;
      panY = e.clientY - _panSY;
      applyTransform();
    }
  };

  document.onmouseup = function() {
    if (dragCard) {
      const cardId = dragCard.dataset.id;
      const x = parseInt(dragCard.style.left) || 0;
      const y = parseInt(dragCard.style.top)  || 0;
      const cards = getCards(activePid, activeSid);
      const card  = cards.find(function(c) { return c.id === cardId; });
      if (card) { card.x = x; card.y = y; saveNN(); }
      dragCard.classList.remove('dragging');
      dragCard.style.zIndex = '';
      dragCard = null;
    }
    if (resizing) {
      const cards = getCards(activePid, activeSid);
      const card  = cards.find(function(c) { return c.id === resizing.id; });
      if (card) {
        card.w = parseInt(resizing.el.style.width)  || card.w;
        card.h = parseInt(resizing.el.style.height) || card.h;
        saveNN();
      }
      resizing = null;
    }
    if (_panning) {
      _panning = false;
      const w2 = el('canvasWrap');
      if (w2) w2.style.cursor = 'grab';
    }
  };
}

// ── Render a single card ──────────────────────────────────────────────────────
function renderCard(d) {
  const canvas = el('canvas');
  if (!canvas) return;
  const hint = canvas.querySelector('.canvas-hint');
  if (hint) hint.remove();

  const el2 = document.createElement('div');
  el2.className = 'card ' + d.type;
  el2.id = 'card-' + d.id;
  el2.dataset.id = d.id;
  el2.style.left = (d.x || 40) + 'px';
  el2.style.top  = (d.y || 40) + 'px';
  if (d.w) el2.style.width  = d.w + 'px';
  if (d.h) el2.style.height = d.h + 'px';
  if (d.type === 'frame') el2.style.zIndex = '0'; // frames stay behind cards

  el2.innerHTML = cardHTML(d, el2);
  canvas.appendChild(el2);
  initCardEvents(el2, d);
}

function rerenderCard(d) {
  const existing = el('card-' + d.id);
  if (!existing) return;
  const x = existing.style.left, y = existing.style.top;
  const isChar = d.type === 'char-card' || d.type === 'char-card-full';
  const w = isChar ? '' : existing.style.width;
  const h = isChar ? '' : existing.style.height;
  existing.innerHTML = cardHTML(d, existing);
  existing.style.left = x; existing.style.top = y;
  if (w) existing.style.width = w;
  if (h) existing.style.height = h;
  initCardEvents(existing, d);
}

// ── Card HTML ─────────────────────────────────────────────────────────────────
function getGrad(d) {
  if (d.cardColor) {
    const cc = CARD_COLORS.find(function(c) { return c.id === d.cardColor; });
    if (cc) return cc.grad;
  }
  const map = {
    'char-card':'linear-gradient(135deg,#7c5cbf,#5e4a9e)',
    'char-card-full':'linear-gradient(135deg,#5e4a9e,#3d3070)',
    'loc-card':'linear-gradient(135deg,#2e7d5e,#1e5c44)',
    'note-card':'linear-gradient(135deg,#3b6ea5,#2d5a8e)',
    'timeline-card':'linear-gradient(135deg,#5a6ea0,#3d4f7a)',
    'rel-card':'linear-gradient(135deg,#9c5c5c,#7a3d3d)',
    'rule-card':'linear-gradient(135deg,#4a7a6e,#2e5c52)',
    'item-card':'linear-gradient(135deg,#7a5230,#5a3418)',
    'lore-card':'linear-gradient(135deg,#4a6e7a,#2d4e5c)',
    'faction-card':'linear-gradient(135deg,#6e4a7a,#4a2d5e)',
    'faction-full':'linear-gradient(135deg,#4a2d5e,#2d1a40)',
    'table-card':'linear-gradient(135deg,#4a5568,#2d3748)',
  };
  return map[d.type] || 'linear-gradient(135deg,#5a6ea0,#3d4f7a)';
}

function colorDotHTML(d) {
  if (d.type === 'note-card') return '';
  const dot = d.cardColor
    ? (CARD_COLORS.find(function(c) { return c.id === d.cardColor; }) || {}).dot || 'rgba(255,255,255,.35)'
    : 'rgba(255,255,255,.35)';
  return '<span class="color-dot" style="background:' + dot + '"'
       + ' onclick="event.stopPropagation();toggleColorPicker(\'' + d.id + '\',\'' + (d.cardColor || '') + '\',this)"'
       + ' title="Change color"></span>';
}

function cardHTML(d, el2) {
  const grad = getGrad(d);
  const dot  = colorDotHTML(d);
  const dh   = '<span class="card-drag-handle">⠿</span>';
  const cb   = '<button class="card-close" onclick="deleteCard(\'' + d.id + '\')">×</button>';
  const rh   = '<div class="resize-handle"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M12 0L0 12" stroke="currentColor" stroke-width="1.5"/><path d="M12 6L6 12" stroke="currentColor" stroke-width="1.5"/></svg></div>';

  // ── Char card (collapsed portrait) ──
  if (d.type === 'char-card' || d.type === 'char-card-full') {
    const col = d.cardColor
      ? (CARD_COLORS.find(function(c) { return c.id === d.cardColor; }) || {}).dot || (d.type === 'char-card' ? '#7c5cbf' : '#5e4a9e')
      : (d.type === 'char-card' ? '#7c5cbf' : '#5e4a9e');
    const imgBg = d.img
      ? '<img class="char-collapsed-img" src="' + d.img + '" style="object-position:' + (d.imgPosX !== undefined ? d.imgPosX : 50) + '% ' + (d.imgPosY !== undefined ? d.imgPosY : 50) + '%;transform:scale(' + ((d.imgZoom || 100)/100) + ');transform-origin:' + (d.imgPosX !== undefined ? d.imgPosX : 50) + '% ' + (d.imgPosY !== undefined ? d.imgPosY : 50) + '%" alt=""/><div class="char-collapsed-gradient"></div>'
      : '<div class="char-collapsed-color" style="background:linear-gradient(150deg,' + col + 'ee,' + col + '99)"></div>';
    const roleHtml  = d.role ? '<div class="char-collapsed-role">' + esc(d.role) + '</div>' : '';
    const traits    = [d.trait1, d.trait2, d.trait3].filter(Boolean);
    const traitHtml = traits.length
      ? '<div class="char-collapsed-traits">' + traits.map(function(t) { return '<span class="char-collapsed-trait-chip">' + esc(t) + '</span>'; }).join('') + '</div>'
      : '';
    return imgBg
      + '<div class="char-collapsed-top"><span class="char-type-badge">Character</span>'
      + '<div class="char-collapsed-controls">' + dot.replace('class="color-dot"', 'class="char-collapsed-btn color-dot"')
      + '<button class="char-collapsed-btn" onclick="event.stopPropagation();deleteCard(\'' + d.id + '\')">×</button></div></div>'
      + '<div class="char-collapsed-bottom" onclick="openCharModal(\'' + d.id + '\')">'
      + roleHtml + '<div class="char-collapsed-name">' + esc(d.name || 'Character') + '</div>' + traitHtml + '</div>';
  }

  // ── Ref card ──
  if (d.type === 'ref-card') {
    const sec  = SECTIONS.find(function(s) { return s.id === d.refSid; });
    const tl   = (d.refType || '').replace(/-/g, ' ');
    const hc   = d.refColor || '#5a6ea0';
    const snip = d.refSnippet ? '<div class="ref-card-snippet-text">' + esc(d.refSnippet) + '</div>' : '';
    const bg   = d.refImg
      ? '<img class="ref-card-img-bg" src="' + d.refImg + '"/><div class="ref-card-img-overlay"></div>'
      : '<div class="ref-card-color-bg" style="background:linear-gradient(150deg,' + hc + 'ee,' + hc + '99)"></div>';
    return bg
      + '<div class="ref-card-topbar"><span class="ref-card-section-badge">' + esc(sec ? sec.label : '') + '</span>'
      + '<button class="ref-card-del" onclick="event.stopPropagation();deleteCard(\'' + d.id + '\')">×</button></div>'
      + '<div class="ref-card-content" onclick="jumpToCard(\'' + d.refId + '\',\'' + d.refSid + '\')">'
      + '<span class="ref-card-label-chip">' + esc(tl) + '</span>'
      + '<span class="ref-card-name">' + esc(d.refName || 'Untitled') + '</span>' + snip + '</div>';
  }

  // ── Frame ──
  if (d.type === 'frame') {
    const col2 = FRAME_COLORS[d.color || 'purple'] || '#5a6ea0';
    if (el2) el2.style.background = 'linear-gradient(150deg,' + col2 + 'ee,' + col2 + '99)';
    const cnt = getCards(activePid, activeSid).filter(function(c) { return c.frameId === d.id; }).length;
    return '<div class="frame-inner">'
      + '<div class="frame-header">'
      + '<input class="frame-label-input" value="' + esc(d.label || 'Group') + '" oninput="updateCard(\'' + d.id + '\',\'label\',this.value)" onclick="event.stopPropagation()"/>'
      + '<button class="frame-open-btn" onclick="event.stopPropagation();openFrame(\'' + d.id + '\')">Open ↗</button>'
      + '<button class="card-close" onclick="event.stopPropagation();deleteCard(\'' + d.id + '\')">×</button>'
      + '</div>'
      + '<div class="frame-body" onclick="openFrame(\'' + d.id + '\')">'
      + '<div class="frame-count">' + cnt + ' card' + (cnt === 1 ? '' : 's') + ' inside</div>'
      + '</div>'
      + '<div class="frame-resize-handle" data-frame-resize="' + d.id + '">'
      + '<svg width="10" height="10" viewBox="0 0 12 12"><path d="M12 0L0 12" stroke="rgba(255,255,255,.5)" stroke-width="2"/><path d="M12 6L6 12" stroke="rgba(255,255,255,.5)" stroke-width="2"/></svg>'
      + '</div></div>';
  }

  // ── Note card — clean elegant writing card ──
  if (d.type === 'note-card') {
    return '<div class="note-card-inner">'
      + '<div class="note-card-top">'
      + '<input class="note-title-input" value="' + esc(d.title) + '" placeholder="Untitled note" oninput="updateCard(\'' + d.id + '\',\'title\',this.value)"/>'
      + cb
      + '</div>'
      + '<div class="note-divider"></div>'
      + '<textarea class="note-textarea" placeholder="Write anything…" oninput="updateCard(\'' + d.id + '\',\'body\',this.value)">' + esc(d.body) + '</textarea>'
      + '</div>' + rh;
  }

  // ── Location card — with image slot ──
  if (d.type === 'loc-card') {
    const locImg = d.img
      ? '<img src="' + d.img + '" style="width:100%;height:90px;object-fit:cover;display:block;cursor:pointer" onclick="triggerLocImg(\'' + d.id + '\')" title="Click to change image"/>'
      : '<div style="width:100%;height:70px;background:linear-gradient(135deg,#e8f4f0,#d4ece4);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6aab8e;font-size:11px;border-bottom:1px solid var(--border)" onclick="triggerLocImg(\'' + d.id + '\')">'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
      + 'Add map or image</div>';
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.name) + '" placeholder="Location name" oninput="updateCard(\'' + d.id + '\',\'name\',this.value)"/>' + cb + '</div>'
      + locImg
      + '<div class="card-body"><div class="char-fields">'
      + '<div class="char-field"><label>Type</label><input value="' + esc(d.type_ || '') + '" placeholder="City, Forest, Dungeon…" oninput="updateCard(\'' + d.id + '\',\'type_\',this.value)"/></div>'
      + '<div class="char-field"><label>Region / Climate</label><input value="' + esc(d.climate || '') + '" placeholder="Tropical, Arctic…" oninput="updateCard(\'' + d.id + '\',\'climate\',this.value)"/></div>'
      + '<div class="char-field"><label>Description</label><textarea rows="3" placeholder="What makes this place special…" oninput="updateCard(\'' + d.id + '\',\'notable\',this.value)">' + esc(d.notable || '') + '</textarea></div>'
      + '</div></div>' + rh;
  }

  // ── Timeline card — clean list ──
  if (d.type === 'timeline-card') {
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.title) + '" placeholder="Timeline" oninput="updateCard(\'' + d.id + '\',\'title\',this.value)"/>' + cb + '</div>'
      + '<div class="note-divider" style="margin:0"></div>'
      + '<div class="card-body timeline-body">' + buildTimelineEntries(d)
      + '<button class="add-row-btn" onclick="addTimelineEntry(\'' + d.id + '\')">+ Add event</button></div>' + rh;
  }

  // ── Relationship card ──
  if (d.type === 'rel-card') {
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.name) + '" placeholder="Character" oninput="updateCard(\'' + d.id + '\',\'name\',this.value)"/>' + cb + '</div>'
      + '<div class="note-divider" style="margin:0"></div>'
      + '<div class="card-body">' + buildRelEntries(d)
      + '<button class="add-row-btn" onclick="addRelEntry(\'' + d.id + '\')">+ Add relationship</button></div>' + rh;
  }

  // ── World Rule card ──
  if (d.type === 'rule-card') {
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.title) + '" placeholder="World Rules" oninput="updateCard(\'' + d.id + '\',\'title\',this.value)"/>' + cb + '</div>'
      + '<div class="note-divider" style="margin:0"></div>'
      + '<div class="card-body">' + buildRuleItems(d)
      + '<button class="add-row-btn" onclick="addRuleItem(\'' + d.id + '\')">+ Add rule</button></div>' + rh;
  }

  // ── Item / Artifact card — rarity as text field ──
  if (d.type === 'item-card') {
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.name) + '" placeholder="Item name" oninput="updateCard(\'' + d.id + '\',\'name\',this.value)"/>' + cb + '</div>'
      + '<div class="note-divider" style="margin:0"></div>'
      + '<div class="card-body"><div class="char-fields">'
      + '<div class="char-field"><label>Rarity</label><input value="' + esc(d.rarity || '') + '" placeholder="Common, Legendary…" oninput="updateCard(\'' + d.id + '\',\'rarity\',this.value)"/></div>'
      + '<div class="char-field"><label>Category</label><input value="' + esc(d.category || '') + '" placeholder="Weapon, Tome, Relic…" oninput="updateCard(\'' + d.id + '\',\'category\',this.value)"/></div>'
      + '<div class="char-field"><label>Ability / Effect</label><textarea rows="2" placeholder="What it does…" oninput="updateCard(\'' + d.id + '\',\'ability\',this.value)">' + esc(d.ability || '') + '</textarea></div>'
      + '<div class="char-field"><label>Lore</label><textarea rows="2" placeholder="History & legend…" oninput="updateCard(\'' + d.id + '\',\'lore\',this.value)">' + esc(d.lore || '') + '</textarea></div>'
      + '</div></div>' + rh;
  }

  // ── Lore Entry card ──
  if (d.type === 'lore-card') {
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.title) + '" placeholder="Lore entry" oninput="updateCard(\'' + d.id + '\',\'title\',this.value)"/>' + cb + '</div>'
      + '<div class="note-divider" style="margin:0"></div>'
      + '<div class="card-body">'
      + '<div class="char-field" style="padding:0 0 6px"><label>Era / Period</label>'
      + '<input value="' + esc(d.era || '') + '" placeholder="Ancient Times, Year 342…" oninput="updateCard(\'' + d.id + '\',\'era\',this.value)"/></div>'
      + '<textarea class="note-textarea" style="min-height:90px;padding:4px 0" placeholder="Write the lore…" oninput="updateCard(\'' + d.id + '\',\'body\',this.value)">' + esc(d.body || '') + '</textarea>'
      + '</div>' + rh;
  }

  // ── Faction card — improved ──
  if (d.type === 'faction-card') {
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.name) + '" placeholder="Faction name" oninput="updateCard(\'' + d.id + '\',\'name\',this.value)"/>' + cb + '</div>'
      + '<div style="padding:6px 13px 2px;font-family:\'Crimson Pro\',serif;font-size:13px;font-style:italic;color:var(--text-muted);border-bottom:1px solid var(--border)">'
      + '<input style="width:100%;background:none;border:none;outline:none;font-family:\'Crimson Pro\',serif;font-size:13px;font-style:italic;color:var(--text-muted)" value="' + esc(d.motto || '') + '" placeholder="Their motto..." oninput="updateCard(\'' + d.id + '\',\'motto\',this.value)"/>'
      + '</div>'
      + '<div class="card-body"><div class="char-fields">'
      + '<div class="char-field"><label>Type</label><input value="' + esc(d.type_ || '') + '" placeholder="Guild, Empire, Cult…" oninput="updateCard(\'' + d.id + '\',\'type_\',this.value)"/></div>'
      + '<div class="char-field"><label>Leader</label><input value="' + esc(d.leader || '') + '" placeholder="Who leads them…" oninput="updateCard(\'' + d.id + '\',\'leader\',this.value)"/></div>'
      + '<div class="char-field"><label>Alignment</label><input value="' + esc(d.alignment || '') + '" placeholder="Lawful Good, Chaotic…" oninput="updateCard(\'' + d.id + '\',\'alignment\',this.value)"/></div>'
      + '<div class="char-field"><label>Goal</label><textarea rows="2" placeholder="What they want…" oninput="updateCard(\'' + d.id + '\',\'goal\',this.value)">' + esc(d.goal || '') + '</textarea></div>'
      + '</div></div>' + rh;
  }

  // ── Faction Full card ──
  if (d.type === 'faction-full') {
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.name) + '" placeholder="Faction name" oninput="updateCard(\'' + d.id + '\',\'name\',this.value)"/>' + cb + '</div>'
      + '<div style="padding:6px 13px 2px;border-bottom:1px solid var(--border)">'
      + '<input style="width:100%;background:none;border:none;outline:none;font-family:\'Crimson Pro\',serif;font-size:13px;font-style:italic;color:var(--text-muted)" value="' + esc(d.motto || '') + '" placeholder="Motto..." oninput="updateCard(\'' + d.id + '\',\'motto\',this.value)"/>'
      + '</div>'
      + '<div class="card-body"><div class="char-full-body">'
      + '<div class="char-full-grid">'
      + '<div class="char-full-field"><label>Type</label><input value="' + esc(d.type_ || '') + '" oninput="updateCard(\'' + d.id + '\',\'type_\',this.value)"/></div>'
      + '<div class="char-full-field"><label>Alignment</label><input value="' + esc(d.alignment || '') + '" oninput="updateCard(\'' + d.id + '\',\'alignment\',this.value)"/></div>'
      + '<div class="char-full-field"><label>Leader</label><input value="' + esc(d.leader || '') + '" oninput="updateCard(\'' + d.id + '\',\'leader\',this.value)"/></div>'
      + '<div class="char-full-field"><label>HQ</label><input value="' + esc(d.hq || '') + '" oninput="updateCard(\'' + d.id + '\',\'hq\',this.value)"/></div>'
      + '</div><div class="char-full-divider"></div>'
      + '<div class="char-full-field"><label>Goal</label><textarea rows="2" oninput="updateCard(\'' + d.id + '\',\'goal\',this.value)">' + esc(d.goal || '') + '</textarea></div>'
      + '<div class="char-full-field"><label>Allies / Enemies</label><input value="' + esc(d.allies || '') + '" placeholder="Allies, enemies…" oninput="updateCard(\'' + d.id + '\',\'allies\',this.value)"/></div>'
      + '<div class="char-full-field"><label>Lore</label><textarea rows="3" placeholder="History, secrets…" oninput="updateCard(\'' + d.id + '\',\'lore\',this.value)">' + esc(d.lore || '') + '</textarea></div>'
      + '</div></div>' + rh;
  }

  // ── Table card ──
  if (d.type === 'table-card') {
    return '<div class="card-header" style="background:' + grad + '">' + dh + dot
      + '<input class="card-title-input" value="' + esc(d.title) + '" placeholder="Table title" oninput="updateCard(\'' + d.id + '\',\'title\',this.value)"/>' + cb + '</div>'
      + '<div class="card-body table-body">' + buildTableHTML(d) + '</div>' + rh;
  }

  // fallback
  return '<div class="card-header" style="background:' + grad + '">' + dh + dot + '<span>Card</span>' + cb + '</div><div class="card-body"></div>';
}



// ── Card HTML helper builders ─────────────────────────────────────────────────
function buildTimelineEntries(d) {
  const entries = d.entries || [];
  return entries.map(function(e, i) {
    const isLast = i === entries.length - 1;
    return '<div class="timeline-entry">'
      + '<div class="tl-dot-col"><div class="timeline-dot"></div>' + (isLast ? '' : '<div class="tl-line"></div>') + '</div>'
      + '<div class="timeline-entry-content">'
      + '<input class="tl-date" value="' + esc(e.date) + '" placeholder="Date…" oninput="updateTimelineEntry(\'' + d.id + '\',' + i + ',\'date\',this.value)"/>'
      + '<input class="tl-text" value="' + esc(e.text) + '" placeholder="What happened…" oninput="updateTimelineEntry(\'' + d.id + '\',' + i + ',\'text\',this.value)"/>'
      + '</div></div>';
  }).join('');
}

function buildRelEntries(d) {
  const entries = d.entries || [];
  return entries.map(function(e, i) {
    const hearts = [1,2,3,4,5].map(function(n) {
      return '<span class="rel-heart' + (n <= (e.strength || 0) ? ' filled' : '') + '"'
           + ' onclick="setRelStrength(\'' + d.id + '\',' + i + ',' + n + ')">♥</span>';
    }).join('');
    return '<div class="rel-entry">'
      + '<div class="rel-avatar">' + (e.name ? e.name.charAt(0).toUpperCase() : '?') + '</div>'
      + '<div class="rel-info">'
      + '<input style="background:none;border:none;border-bottom:1px dashed var(--border);outline:none;font-size:12px;font-weight:500;width:100%;font-family:\'DM Sans\',sans-serif" value="' + esc(e.name) + '" placeholder="Name" oninput="updateRelEntry(\'' + d.id + '\',' + i + ',\'name\',this.value)"/>'
      + '<input style="background:none;border:none;outline:none;font-size:10px;color:var(--text-muted);width:100%;font-family:\'DM Sans\',sans-serif" value="' + esc(e.type) + '" placeholder="Ally, Rival…" oninput="updateRelEntry(\'' + d.id + '\',' + i + ',\'type\',this.value)"/>'
      + '</div><div class="rel-strength">' + hearts + '</div></div>';
  }).join('');
}

function buildRuleItems(d) {
  const rules = d.rules || [];
  return rules.map(function(r, i) {
    return '<div class="rule-item"><div class="rule-num">' + (i + 1) + '</div>'
      + '<textarea class="rule-text" rows="1" placeholder="Rule…" oninput="updateRuleItem(\'' + d.id + '\',' + i + ',this.value)">' + esc(r) + '</textarea></div>';
  }).join('');
}

function buildTableHTML(d) {
  const headers = d.headers || [];
  const cells   = d.cells   || [];
  if (!headers.length) {
    // Size picker grid
    var pickerRows = '';
    for (var r = 1; r <= 6; r++) {
      for (var c = 1; c <= 6; c++) {
        pickerRows += '<div class="tbl-sz-cell" data-r="' + r + '" data-c="' + c + '"'
          + ' onclick="setupTable(\'' + d.id + '\',' + r + ',' + c + ')"'
          + ' onmouseover="highlightTablePicker(this)">'
          + r + 'x' + c + '</div>';
      }
    }
    return '<div style="padding:12px">'
      + '<div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase">Choose table size</div>'
      + '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:3px">' + pickerRows + '</div>'
      + '</div>';
  }
  const hRow = headers.map(function(h, c) {
    return '<th><input class="table-cell" style="font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)" value="' + esc(h) + '" placeholder="Col ' + (c+1) + '" oninput="updateTableHeader(\'' + d.id + '\',' + c + ',this.value)"/></th>';
  }).join('');
  const bRows = cells.map(function(row, r) {
    return '<tr>' + row.map(function(cell, c) {
      return '<td><textarea class="table-cell" rows="1" oninput="updateTableCell(\'' + d.id + '\',' + r + ',' + c + ',this.value)">' + esc(cell) + '</textarea></td>';
    }).join('') + '</tr>';
  }).join('');
  return '<table class="wiki-table"><thead><tr>' + hRow + '</tr></thead><tbody>' + bRows + '</tbody></table>';
}

// ── Card interactions (drag, resize) ─────────────────────────────────────────
function initCardEvents(el2, d) {
  if (d.type === 'frame') { initFrameEvents(el2, d); return; }

  el2.addEventListener('mousedown', function(e) {
    // Don't drag if clicking interactive elements or char card click zones
    const skip = 'input,textarea,select,button,.char-collapsed-bottom,.char-collapsed-btn,.ref-card-content,.ref-card-del,.resize-handle,.color-dot,.color-popover';
    if (e.target.closest(skip)) return;
    e.preventDefault();
    dragCard   = el2;
    dragOrigX  = parseInt(el2.style.left) || 0;
    dragOrigY  = parseInt(el2.style.top)  || 0;
    const rect = el2.getBoundingClientRect();
    dragOffX   = (e.clientX - rect.left) / zoom;
    dragOffY   = (e.clientY - rect.top)  / zoom;
    el2.classList.add('dragging');
    el2.style.zIndex = 999;
  });

  const rh = el2.querySelector('.resize-handle');
  if (rh) {
    rh.addEventListener('mousedown', function(e) {
      e.stopPropagation(); e.preventDefault();
      resizing      = { el: el2, id: d.id };
      resizeStartW  = el2.offsetWidth;
      resizeStartH  = el2.offsetHeight;
      resizeStartMX = e.clientX;
      resizeStartMY = e.clientY;
    });
  }
}

function initFrameEvents(el2, d) {
  el2.addEventListener('mousedown', function(e) {
    if (e.target.closest('input,button,.frame-resize-handle')) return;
    e.preventDefault();
    dragCard  = el2;
    dragOrigX = parseInt(el2.style.left) || 0;
    dragOrigY = parseInt(el2.style.top)  || 0;
    const rect = el2.getBoundingClientRect();
    dragOffX  = (e.clientX - rect.left) / zoom;
    dragOffY  = (e.clientY - rect.top)  / zoom;
    el2.classList.add('dragging');
    el2.style.zIndex = 1; // keep frames behind other cards
  });

  const frh = el2.querySelector('[data-frame-resize]');
  if (frh) {
    frh.addEventListener('mousedown', function(e) {
      e.stopPropagation(); e.preventDefault();
      resizing      = { el: el2, id: d.id, isFrame: true };
      resizeStartW  = el2.offsetWidth;
      resizeStartH  = el2.offsetHeight;
      resizeStartMX = e.clientX;
      resizeStartMY = e.clientY;
    });
  }
}

// ── Add card / frame ──────────────────────────────────────────────────────────
function addCard(type) {
  if (!activePid) return;
  const cards = getCards(activePid, activeSid);
  const spot  = findFreeSpot(cards);
  const card  = makeCard(type, spot.x, spot.y);
  cards.push(card);
  saveNN();
  const canvas = el('canvas');
  if (canvas) {
    const hint = canvas.querySelector('.canvas-hint');
    if (hint) hint.remove();
  }
  renderCard(card);
}

function addFrame() {
  if (!activePid) return;
  const cards  = getCards(activePid, activeSid);
  const spot   = findFreeSpot(cards);
  const colors = Object.keys(FRAME_COLORS);
  const color  = colors[cards.filter(function(c) { return c.type === 'frame'; }).length % colors.length];
  const card   = { id:uid(), type:'frame', x:spot.x, y:spot.y, w:220, h:160, label:'Group', color:color };
  cards.push(card);
  saveNN();
  renderCard(card);
}

function makeCard(type, x, y) {
  const base = { id:uid(), type:type, x:x||40, y:y||40, w:null, h:null };
  const map = {
    'char-card':      { name:'Character', role:'', age:'', trait1:'', trait2:'', bio:'', img:null },
    'char-card-full': { name:'Character', role:'', age:'', gender:'', nationality:'', motivation:'', appearance:'', personality:'', fear:'', trait1:'', trait2:'', trait3:'', bio:'', img:null },
    'loc-card':       { name:'Location', type_:'', climate:'', notable:'' },
    'note-card':      { title:'Note', body:'' },
    'timeline-card':  { title:'Timeline', entries:[] },
    'rel-card':       { name:'Character', entries:[] },
    'rule-card':      { title:'World Rules', rules:[] },
    'item-card':      { name:'Item', rarity:'Common', category:'', ability:'', lore:'' },
    'lore-card':      { title:'Lore Entry', era:'', body:'', tags:'' },
    'faction-card':   { name:'Faction', type_:'', alignment:'Neutral', leader:'', motto:'' },
    'faction-full':   { name:'Faction', motto:'', type_:'', alignment:'Neutral', leader:'', hq:'', goal:'', lore:'' },
    'table-card':     { title:'Table', headers:[], cells:[] },
  };
  return Object.assign(base, map[type] || {});
}

function findFreeSpot(cards) {
  for (let y = 40; y < 2000; y += 240) {
    for (let x = 40; x < 3000; x += 280) {
      const clear = cards.every(function(c) {
        return Math.abs(c.x - x) > 200 || Math.abs(c.y - y) > 200;
      });
      if (clear) return { x:x, y:y };
    }
  }
  return { x: 40 + cards.length * 30, y: 40 + cards.length * 30 };
}

  showConfirmModal(
    'Delete ' + (card && card.type === 'frame' ? 'group' : 'card') + '?',

  var img = el('charHeroImg_' + cardId);
  if (img) {
    var px = card.imgPosX  !== undefined ? card.imgPosX  : 50;

    img.style.transform      = 'scale(' + (pz / 100) + ')';
    img.style.transformOrigin = px + '% ' + py + '%';
  }
  rerenderCard(card);
}
