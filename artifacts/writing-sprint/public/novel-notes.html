      openCharModal(cardId);
    };
    reader.readAsDataURL(inp.files[0]);
  };
  inp.click();
}

// ── Frame overlay (open group) ────────────────────────────────────────────────
function openFrame(frameId) {
  const cards = getCards(activePid, activeSid);
  const frame = cards.find(function(c) { return c.id === frameId; });
  if (!frame) return;
  const inside  = cards.filter(function(c) { return c.frameId === frameId; });
  const outside = cards.filter(function(c) { return !c.frameId && c.type !== 'frame' && c.id !== frameId; });

  var existing = el('frameOverlay');
  if (existing) existing.remove();

  const ov = document.createElement('div');
  ov.id = 'frameOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:7000;display:flex;flex-direction:column;background:var(--bg)';

  // Header
  const hdr = document.createElement('div');
  hdr.style.cssText = 'background:var(--surface);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0';
  hdr.innerHTML = '<strong style="font-family:\'Lora\',serif;font-size:16px">' + esc(frame.label || 'Group') + '</strong>'
    + '<span style="font-size:12px;color:var(--text-muted)">' + inside.length + ' card' + (inside.length !== 1 ? 's' : '') + ' inside</span>'
    + '<div style="flex:1"></div>'
    + '<button onclick="el(\'frameOverlay\').remove()" style="border:1px solid var(--border);background:none;border-radius:7px;padding:4px 14px;cursor:pointer;font-family:\'DM Sans\',sans-serif;font-size:13px">✕ Close</button>';

  // Body: two columns — inside and available to add
  const body = document.createElement('div');
  body.style.cssText = 'flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:0;';

  // Left: inside the group
  const leftCol = document.createElement('div');
  leftCol.style.cssText = 'border-right:1px solid var(--border);padding:16px;';
  leftCol.innerHTML = '<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px">Inside this group</div>';

  if (inside.length === 0) {
    leftCol.innerHTML += '<div style="color:var(--text-muted);font-size:13px;padding:12px 0">No cards yet. Add some from the right →</div>';
  } else {
    inside.forEach(function(c) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px';
      const dot = getGrad(c).match(/#[0-9a-f]{6}/i)?.[0] || '#888';
      row.innerHTML = '<div style="width:10px;height:10px;border-radius:50%;background:' + dot + ';flex-shrink:0"></div>'
        + '<span style="flex:1;font-size:13px;color:var(--text-primary);font-family:\'DM Sans\',sans-serif">' + esc(c.name || c.title || c.label || c.type) + '</span>'
        + '<span style="font-size:10px;color:var(--text-muted)">' + c.type.replace(/-/g,' ') + '</span>'
        + '<button data-eject="' + c.id + '" style="border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px" title="Remove from group">↑</button>';
      row.querySelector('[data-eject]').onclick = function() {
        var allCards = getCards(activePid, activeSid);
        var target   = allCards.find(function(x) { return x.id === c.id; });
        if (target) { delete target.frameId; saveNN(); }
        openFrame(frameId); // refresh
      };
      leftCol.appendChild(row);
    });
  }

  // Right: cards available to add
  const rightCol = document.createElement('div');
  rightCol.style.cssText = 'padding:16px;';
  rightCol.innerHTML = '<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px">Add to group</div>';

  if (outside.length === 0) {
    rightCol.innerHTML += '<div style="color:var(--text-muted);font-size:13px;padding:12px 0">No other cards on this canvas.</div>';
  } else {
    outside.forEach(function(c) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:border-color .15s';
      row.onmouseenter = function() { row.style.borderColor = 'var(--accent)'; };
      row.onmouseleave = function() { row.style.borderColor = 'var(--border)'; };
      const dot = getGrad(c).match(/#[0-9a-f]{6}/i)?.[0] || '#888';
      row.innerHTML = '<div style="width:10px;height:10px;border-radius:50%;background:' + dot + ';flex-shrink:0"></div>'
        + '<span style="flex:1;font-size:13px;color:var(--text-primary);font-family:\'DM Sans\',sans-serif">' + esc(c.name || c.title || c.label || c.type) + '</span>'
        + '<span style="font-size:10px;color:var(--text-muted)">' + c.type.replace(/-/g,' ') + '</span>'
        + '<span style="font-size:11px;color:var(--accent);font-weight:600">+ Add</span>';
      row.onclick = function() {
        var allCards = getCards(activePid, activeSid);
        var target   = allCards.find(function(x) { return x.id === c.id; });
        if (target) { target.frameId = frameId; saveNN(); }
        openFrame(frameId); // refresh
      };
      rightCol.appendChild(row);
    });
  }

  body.appendChild(leftCol);
  body.appendChild(rightCol);
  ov.appendChild(hdr);
  ov.appendChild(body);
  document.body.appendChild(ov);
}

// ── Overview: All Cards picker + pin to overview ──────────────────────────────
function toggleCardPicker() {
  const existing = el('cardPickerPanel');
  if (existing) { existing.remove(); return; }

  const panel = document.createElement('div');
  panel.id = 'cardPickerPanel';
  panel.className = 'card-picker-panel';
  panel.innerHTML =
    '<div style="padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">'
    + '<input style="flex:1;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;font-family:\'DM Sans\',sans-serif;outline:none" placeholder="Search cards…" oninput="populateCardPicker(this.value)" id="cardPickerSearch"/>'
    + '<button onclick="el(\'cardPickerPanel\').remove()" style="border:none;background:none;cursor:pointer;font-size:16px;color:var(--text-muted)">×</button>'
    + '</div>'
    + '<div id="cardPickerList" style="overflow-y:auto;max-height:360px"></div>';

  const ob = el('overviewBar');
  if (ob) ob.appendChild(panel);
  else document.body.appendChild(panel);
  populateCardPicker('');
}

function getAllCards() {
  const result = [];
  if (!nnData[activePid]) return result;
  const cardsMap = nnData[activePid].cards || {};
  SECTIONS.forEach(function(s) {
    (cardsMap[s.id] || []).forEach(function(c) {
      if (c.type !== 'ref-card') result.push(Object.assign({}, c, { _sid: s.id, _sLabel: s.label }));
    });
  });
  return result;
}

function populateCardPicker(query) {
  const list = el('cardPickerList');
  if (!list) return;
  const q    = (query || '').toLowerCase();
  const all  = getAllCards().filter(function(c) {
    if (c.type === 'frame') return false;
    const name = (c.name || c.title || c.label || '').toLowerCase();
    return !q || name.indexOf(q) >= 0 || c._sLabel.toLowerCase().indexOf(q) >= 0;
  });

  if (!all.length) {
    list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">' + (q ? 'No results' : 'No cards yet') + '</div>';
    return;
  }

  // Group by section
  const groups = {};
  all.forEach(function(c) {
    if (!groups[c._sid]) groups[c._sid] = { label: c._sLabel, cards: [] };
    groups[c._sid].cards.push(c);
  });

  let html = '';
  Object.values(groups).forEach(function(g) {
    html += '<div style="padding:6px 10px 2px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)">' + esc(g.label) + '</div>';
    g.cards.forEach(function(c) {
      const dot = c.cardColor
        ? (CARD_COLORS.find(function(x) { return x.id === c.cardColor; }) || {}).dot || '#888'
        : '#888';
      const name = esc(c.name || c.title || c.label || c.type);
      html += '<div class="card-picker-item">'
            + '<div class="card-picker-dot" style="background:' + dot + '"></div>'
            + '<span class="card-picker-name">' + name + '</span>'
            + '<span class="card-picker-type">' + c.type.replace(/-/g, ' ') + '</span>'
            + '<button class="card-picker-place" onclick="pinToOverview(\'' + c.id + '\',\'' + c._sid + '\')">Pin</button>'
            + '</div>';
    });
  });
  list.innerHTML = html;
}

function pinToOverview(cardId, fromSid) {
  const allCards = getAllCards();
  const src = allCards.find(function(c) { return c.id === cardId; });
  if (!src) return;

  const overviewCards = getCards(activePid, 'overview');
  if (overviewCards.find(function(c) { return c.type === 'ref-card' && c.refId === cardId; })) {
    el('cardPickerPanel') && el('cardPickerPanel').remove();
    if (activeSid !== 'overview') { activeSid = 'overview'; renderWiki(); }
    return;
  }

  const TYPE_COLORS = {
    'char-card':'#7c5cbf','char-card-full':'#5e4a9e','loc-card':'#2e7d5e','note-card':'#3b6ea5',
    'timeline-card':'#5a6ea0','rel-card':'#9c5c5c','rule-card':'#4a7a6e','table-card':'#4a5568',
    'item-card':'#7a5230','lore-card':'#4a6e7a','faction-card':'#6e4a7a','faction-full':'#4a2d5e',
  };
  const refCard = {
    id: uid(), type: 'ref-card',
    x: 40 + overviewCards.filter(function(c) { return c.type === 'ref-card'; }).length * 190,
    y: 40,
    refId: cardId, refSid: fromSid,
    refName: src.name || src.title || src.label || 'Card',
    refType: src.type,
    refColor: src.cardColor ? (CARD_COLORS.find(function(c) { return c.id === src.cardColor; }) || {}).dot : TYPE_COLORS[src.type] || '#5a6ea0',
    refSnippet: src.role || src.body || src.motto || '',
    refImg: src.img || null,
  };

  overviewCards.push(refCard);
  saveNN();
  el('cardPickerPanel') && el('cardPickerPanel').remove();
  if (activeSid !== 'overview') { activeSid = 'overview'; renderWiki(); }
  else renderCard(refCard);
}

function jumpToCard(cardId, sid) {
  if (sid !== activeSid) { activeSid = sid; renderWiki(); }
  setTimeout(function() {
    const cardEl = el('card-' + cardId);
    if (cardEl) {
      const wrap  = el('canvasWrap');
      if (wrap) {
        panX = wrap.clientWidth / 2  - (parseInt(cardEl.style.left) || 0) * zoom - 80;
        panY = wrap.clientHeight / 2 - (parseInt(cardEl.style.top)  || 0) * zoom - 100;
        applyTransform();
      }
      cardEl.style.outline = '2px solid var(--accent)';
      setTimeout(function() { cardEl.style.outline = ''; }, 1500);
    }
  }, 200);
}

// ── Create project ────────────────────────────────────────────────────────────
function openCreateModal() {
  selectedIconId = MODAL_ICONS[0].id;
  selectedColor  = PROJ_COLORS()[0];
  buildModalIcons();
  buildModalColors();
  el('newProjName').value  = '';
  el('newProjGenre').value = '';
  updateModalPreview();
  el('createModal').style.display = 'flex';
  setTimeout(function() { el('newProjName').focus(); }, 100);
}

function closeCreateModal(e) {
  if (e && e.target !== el('createModal')) return;
  el('createModal').style.display = 'none';
}

function buildModalIcons() {
  const row = el('emojiRow');
  if (!row) return;
  row.innerHTML = MODAL_ICONS.map(function(ic) {
    return '<button class="modal-emoji-btn' + (ic.id === selectedIconId ? ' selected' : '') + '"'
         + ' onclick="selectIcon(\'' + ic.id + '\')">' + ic.svg + '</button>';
  }).join('');
}

function buildModalColors() {
  const row = el('colorRow');
  if (!row) return;
  row.innerHTML = PROJ_COLORS().map(function(c) {
    return '<div class="modal-color-swatch' + (c === selectedColor ? ' selected' : '') + '"'
         + ' style="background:' + c + '" onclick="selectProjColor(\'' + c + '\')"></div>';
  }).join('');
}

function selectIcon(id) {
  selectedIconId = id;
  buildModalIcons();
  updateModalPreview();
}

function selectProjColor(c) {
  selectedColor = c;
  buildModalColors();
  updateModalPreview();
}

function updateModalPreview() {
  const name  = (el('newProjName')  && el('newProjName').value.trim())  || 'Project Name';
  const genre = (el('newProjGenre') && el('newProjGenre').value.trim()) || 'Genre / Tagline';
  const av    = el('previewAvatar');
  const pn    = el('previewName');
  const pg    = el('previewGenre');
  if (av) { av.style.background = selectedColor; av.innerHTML = getIconSvg(selectedIconId, 20); }
  if (pn) pn.textContent = name;
  if (pg) pg.textContent = genre;
}

function createProject() {
  const name = el('newProjName') && el('newProjName').value.trim();
  if (!name) { el('newProjName').focus(); return; }
  const newProj = {
    id: uid(), name: name,
    _nn: { genre: el('newProjGenre').value.trim(), iconId: selectedIconId, color: selectedColor },
  };
  projects.push(newProj);
  saveProjects();
  el('createModal').style.display = 'none';
  renderProjectList();
  selectProject(newProj.id);
}

async function saveProjects() {
  const stored = await idbGet('folio_state') || {};
  stored.state = stored.state || {};
  stored.state.projects = projects;
  await idbSet('folio_state', stored);
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportProject() {
  if (!activePid) return;
  const p    = projects.find(function(x) { return x.id === activePid; });
  const data = { project: p, wiki: nnData[activePid] };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = (p ? p.name.replace(/\s+/g, '-') : 'export') + '.json';
  a.click();
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (el('createModal').style.display !== 'none') {
    if (e.key === 'Escape') el('createModal').style.display = 'none';
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') createProject();
  }
  if (e.key === 'Escape') {
    document.querySelectorAll('.char-modal-overlay').forEach(function(m) { m.remove(); });
    document.querySelectorAll('.color-popover').forEach(function(p) { p.remove(); });
    document.querySelectorAll('#frameOverlay').forEach(function(f) { f.remove(); });
  }
});

// ── Safe wrapper — catches real errors instead of "Script error." ─────────────
function safe(fn) {
  return function() {
    try {
      return fn.apply(this, arguments);
    } catch(e) {
      console.error('Novel Notes [' + fn.name + ']:', e.message, e.stack);
      alert('Error in ' + fn.name + ':\n' + e.message);
    }
  };
}

// ── Global error handler ──────────────────────────────────────────────────────
window.addEventListener('error', function(e) {
  console.error('Novel Notes error:', e.message, 'at', e.filename, e.lineno);
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('Novel Notes unhandled promise:', e.reason);
});

// ── Expose to global scope (required for inline handlers with type="module") ──
window.addCard = safe(addCard);
window.addFrame = safe(addFrame);
window.selectProject = safe(selectProject);
window.selectSection = safe(selectSection);
window.openCreateModal = safe(openCreateModal);
window.closeCreateModal = safe(closeCreateModal);
window.createProject = safe(createProject);
window.deleteCard = safe(deleteCard);
window.updateCard = safe(updateCard);
window.updateModalPreview = safe(updateModalPreview);
window.selectIcon = safe(selectIcon);
window.selectProjColor = safe(selectProjColor);
window.setZoom = safe(setZoom);
window.clearCanvas = safe(clearCanvas);
window.exportProject = safe(exportProject);
window.toggleColorPicker = safe(toggleColorPicker);
window.setCardColor = safe(setCardColor);
window.openCharModal = safe(openCharModal);
window.triggerCharImg = safe(triggerCharImg);
window.openFrame = safe(openFrame);
window.toggleCardPicker = safe(toggleCardPicker);
window.populateCardPicker = safe(populateCardPicker);
window.pinToOverview = safe(pinToOverview);
window.jumpToCard = safe(jumpToCard);
window.addTimelineEntry = safe(addTimelineEntry);
window.updateTimelineEntry = safe(updateTimelineEntry);
window.addRelEntry = safe(addRelEntry);
window.updateRelEntry = safe(updateRelEntry);
window.setRelStrength = safe(setRelStrength);
window.addRuleItem = safe(addRuleItem);
window.updateRuleItem = safe(updateRuleItem);
window.updateTableHeader = safe(updateTableHeader);
window.updateTableCell = safe(updateTableCell);
window.initTable = safe(setupTable);  // alias - was renamed to setupTable
window.getCardData = safe(getCardData);
window.rerenderCard = safe(rerenderCard);
window.el = safe(el);
// ── Embedded sync (postMessage bridge with parent React app) ──────────────────
const _isEmbedded = window.parent !== window;
if (_isEmbedded) {
  window.addEventListener('message', function(e) {
    if (e.source !== window.parent) return;
    const msg = e.data;
    if (!msg || msg.type !== 'nn:init') return;
    if (msg.data && msg.data.nnData && Object.keys(msg.data.nnData).length > 0) {
      nnData = msg.data.nnData;
      idbSet(NN_KEY, nnData);
    }
    renderProjectList();
    if (activePid) renderWiki();
  });
}

try {
  await loadNN();
  const stored = await idbGet('folio_state');
  if (stored && stored.state && stored.state.projects && stored.state.projects.length) {
    projects = stored.state.projects;
  }
  renderProjectList();
} catch(e) {
  console.error('Novel Notes startup:', e);
  renderProjectList();
}

if (_isEmbedded) {
  window.parent.postMessage({ type: 'nn:ready' }, '*');
}

</script>
