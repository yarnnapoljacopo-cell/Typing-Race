<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Demo background — remove this in your project */
body { font-family: 'Inter', sans-serif; background: #edeae4; min-height: 100vh; }

/* ── FLOATING PILL SIDEBAR ── */
.sb {
  position: fixed;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 24px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.09);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 4px;
  z-index: 300;
  overflow: hidden;
  transition: width 0.24s cubic-bezier(.4,0,.2,1), border-radius 0.24s cubic-bezier(.4,0,.2,1);
}
.sb:hover {
  width: 172px;
  border-radius: 16px;
}

/* Logo */
.sb-logo {
  width: 28px; height: 28px;
  background: #1a1520;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-bottom: 8px;
}

/* Divider */
.sb-sep {
  width: 24px; height: 1px;
  background: rgba(0,0,0,0.08);
  margin: 4px 0;
  flex-shrink: 0;
  transition: width 0.24s cubic-bezier(.4,0,.2,1);
}
.sb:hover .sb-sep { width: calc(100% - 16px); }

/* Nav items */
.ni {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: 10px;
  cursor: pointer;
  color: #8a8680;
  white-space: nowrap;
  text-decoration: none;
  width: calc(100% - 8px);
  transition: background 0.24s, color 0.24s, box-shadow 0.24s;
}
.ni:hover { background: rgba(0,0,0,0.04); color: #1a1813; }
.ni.active { background: #ffffff; color: #4a54e8; box-shadow: 0 1px 6px rgba(0,0,0,0.09); }

/* Icon */
.ni-ico {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto;
}
.sb:hover .ni-ico { margin: 0; }

/* Label */
.ni-lbl {
  font-size: 13px; font-weight: 500;
  opacity: 0; width: 0; overflow: hidden;
  transition: opacity 0.24s;
  pointer-events: none;
}
.sb:hover .ni-lbl { opacity: 1; width: auto; }

/* Badge */
.ni-badge {
  margin-left: auto; flex-shrink: 0;
  background: #f0a500; color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 1px 5px; border-radius: 10px;
  opacity: 0;
  transition: opacity 0.24s;
}
.sb:hover .ni-badge { opacity: 1; }

/* Avatar at bottom */
.sb-foot {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0,0,0,0.06);
  color: #9a968e;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
  margin-top: 4px;
  transition: background 0.24s, color 0.24s;
}
.sb-foot:hover { background: #eceeff; color: #4a54e8; }
</style>
</head>
<body>

<aside class="sb">

  <!-- Logo -->
  <div class="sb-logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c8b8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19l7-7-7-7-7 7 7 7z"/>
      <path d="M12 5v14"/>
      <path d="M2 12h3"/>
      <path d="M19 12h3"/>
    </svg>
  </div>

  <!-- Nav items -->
  <a class="ni active" href="#">
    <span class="ni-ico">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </span>
    <span class="ni-lbl">Sprint</span>
  </a>

  <a class="ni" href="#">
    <span class="ni-ico">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    </span>
    <span class="ni-lbl">My Files</span>
  </a>

  <a class="ni" href="#">
    <span class="ni-ico">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </span>
    <span class="ni-lbl">Friends</span>
    <span class="ni-badge">3</span>
  </a>

  <a class="ni" href="#">
    <span class="ni-ico">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </span>
    <span class="ni-lbl">Past Sprints</span>
  </a>

  <div class="sb-sep"></div>

  <a class="ni" href="#">
    <span class="ni-ico">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    </span>
    <span class="ni-lbl">Shop</span>
  </a>

  <a class="ni" href="#">
    <span class="ni-ico">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </span>
    <span class="ni-lbl">My Profile</span>
  </a>

  <!-- User avatar -->
  <div class="sb-foot">E</div>

</aside>

<script>
  document.querySelectorAll('.ni').forEach(n => {
    n.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.ni').forEach(x => x.classList.remove('active'));
      n.classList.add('active');
    });
  });
</script>

</body>
</html>
